<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 2 — The Family | The Black Willow</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #c4a35a;
  --gold-dim: #8a6f35;
  --bg: #050403;
  --bg2: #0a0806;
  --text: #ede4cc;
  --text-dim: #b8a878;
  --text-muted: #7a6a45;
  --border: #2a2418;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', serif;
  overflow-x: hidden;
}

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(to bottom, rgba(5,4,3,0.95), transparent);
}

.back-link {
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-link:hover { color: var(--gold); }

.music-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(5,4,3,0.8);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px;
}

.music-btn {
  padding: 6px 14px;
  border-radius: 16px;
  font-family: 'Georgia', serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  background: none;
  color: var(--text-muted);
}

.music-btn.active {
  background: var(--gold);
  color: var(--bg);
}

.chapter-label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.main-layout {
  display: grid;
  grid-template-columns: 180px 1fr 180px;
  min-height: 100vh;
  padding-top: 60px;
  padding-bottom: 140px;
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
}

.side-images {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-top: 40px;
}

.side-img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  border-radius: 3px;
  opacity: 0;
  filter: brightness(0.7) sepia(0.2);
  transition: opacity 0.8s ease, filter 0.3s;
  border: 1px solid var(--border);
}

.side-img:hover { filter: brightness(0.9) sepia(0.1); }
.side-img.visible { opacity: 1; }
.side-img:nth-child(1) { transition-delay: 0.2s; }
.side-img:nth-child(2) { transition-delay: 0.5s; }
.side-img:nth-child(3) { transition-delay: 0.8s; }

.center-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 20px;
}

.cover-image {
  width: 100%;
  max-width: 400px;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  margin-bottom: 28px;
  border: 1px solid var(--border);

}

.chapter-title-block {
  text-align: center;
  margin-bottom: 28px;
}

.chapter-num {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.chapter-title {
  font-size: 1.8rem;
  color: var(--gold);
  font-weight: normal;
  margin-bottom: 6px;
}

.chapter-sub {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-style: italic;
}

.player-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: linear-gradient(to top, rgba(5,4,3,0.98) 80%, transparent);
  padding: 16px 32px 24px;
}

.player-track-info {
  text-align: center;
  margin-bottom: 10px;
}

.player-track-name {
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}

.player-track-version {
  font-size: 0.62rem;
  color: var(--text-muted);
  margin-top: 2px;
  font-style: italic;
}

.timeline-wrap {
  position: relative;
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: height 0.2s;
}

.timeline-wrap:hover { height: 8px; }

.timeline-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
  width: 0%;
  pointer-events: none;
}

.timeline-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  transform: translate(-50%, -50%);
  width: 14px;
  height: 14px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(196,163,90,0.5);
  opacity: 0;
  transition: opacity 0.2s;
}

.timeline-wrap:hover .timeline-thumb { opacity: 1; }

.player-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  justify-content: center;
}

.time-display {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: monospace;
  min-width: 48px;
}

.time-display.right { text-align: right; }

.ctrl-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.7rem;
  transition: all 0.15s;
  font-family: 'Georgia', serif;
}

.ctrl-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

.play-btn {
  width: 52px;
  height: 52px;
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
  font-size: 1.1rem;
}

.play-btn:hover { background: #d4b36a; border-color: #d4b36a; color: var(--bg); }

.vol-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 120px;
}

.vol-icon { font-size: 0.85rem; color: var(--text-muted); }

.vol-slider {
  flex: 1;
  height: 4px;
  accent-color: var(--gold);
  cursor: pointer;
}

.speed-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 5px 10px;
  font-size: 0.65rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: 'Georgia', serif;
  letter-spacing: 0.06em;
  transition: all 0.15s;
}

.speed-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

@media (max-width: 768px) {
  .main-layout {
    grid-template-columns: 1fr;
    padding-left: 16px;
    padding-right: 16px;
  }
  .side-images { flex-direction: row; padding-top: 0; }
  .side-images.right-side { display: none; }
  .side-img { aspect-ratio: 1; }
  .player-wrap { padding: 12px 16px 20px; }
  .vol-wrap { display: none; }
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-link">← Black Willow</a>
  <span class="chapter-label">Chapter 2 — The Family</span>
  <div class="music-toggle">
    <button class="music-btn active" id="btn-no-music" onclick="switchVersion('no-music')">🔇 No Music</button>
    <button class="music-btn" id="btn-music" onclick="switchVersion('music')">🎵 Music</button>
  </div>
</div>

<div class="main-layout">

  <div class="side-images left-side">
    <img src="../Images/Festival.jpeg" class="side-img" alt="The Festival" onerror="this.style.display='none'">
    <img src="../Images/HaciendaKitchen.jpeg" class="side-img" alt="The Kitchen" onerror="this.style.display='none'">
    <img src="../Images/Helicopter.jpeg" class="side-img" alt="The Helicopter" onerror="this.style.display='none'">
  </div>

  <div class="center-content">
    <img src="../Images/NewCover.jpeg" class="cover-image" alt="The Black Willow" onerror="this.src='../cover.jpg'">
    <div class="chapter-title-block">
      <div class="chapter-num">Season One · Chapter Two</div>
      <div class="chapter-title">The Family</div>
      <div class="chapter-sub">The valley celebrates. Not everyone is dancing.</div>
    </div>
  </div>

  <div class="side-images right-side">
    <img src="../Images/Boardroom.jpeg" class="side-img" alt="The Boardroom" onerror="this.style.display='none'">
    <img src="../Images/Helicopter.jpeg" class="side-img" alt="Surveying" onerror="this.style.display='none'">
    <img src="../Images/Festival.jpeg" class="side-img" alt="Festival" onerror="this.style.display='none'">
  </div>

</div>

<div class="player-wrap">
  <div class="player-track-info">
    <div class="player-track-name">The Black Willow — Chapter 2: The Family</div>
    <div class="player-track-version" id="version-label">No Music Version</div>
  </div>

  <div class="timeline-wrap" id="timeline" onclick="seekAudio(event)">
    <div class="timeline-fill" id="timeline-fill"></div>
    <div class="timeline-thumb" id="timeline-thumb"></div>
  </div>

  <div class="player-controls">
    <span class="time-display" id="time-cur">0:00</span>

    <div class="vol-wrap">
      <span class="vol-icon">🔊</span>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="100"
        oninput="setVolume(this.value)">
    </div>

    <button class="ctrl-btn" onclick="skipAudio(-30)">‹30</button>
    <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="skipAudio(30)">30›</button>

    <button class="speed-btn" id="speed-btn" onclick="cycleSpeed()">1.0×</button>

    <span class="time-display right" id="time-total">0:00</span>
  </div>
</div>

<audio id="audio-no-music" preload="metadata">
  <source src="../audio/BW_S01E02.mp3" type="audio/mpeg">
</audio>
<audio id="audio-music" preload="metadata">
  <source src="../audio/BW_S01E02_final.mp3" type="audio/mpeg">
</audio>

<script>
let currentVersion = 'no-music';
let currentAudio = document.getElementById('audio-no-music');
let isPlaying = false;
let speeds = [0.8, 0.9, 1.0, 1.1, 1.25, 1.5];
let speedIdx = 2;

function init() {
  setTimeout(() => {
    document.querySelectorAll('.side-img').forEach(img => img.classList.add('visible'));
  }, 300);
  setupAudioEvents(document.getElementById('audio-no-music'));
  setupAudioEvents(document.getElementById('audio-music'));
}

function setupAudioEvents(audio) {
  audio.ontimeupdate = () => {
    if (audio !== currentAudio) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    document.getElementById('timeline-fill').style.width = pct + '%';
    document.getElementById('timeline-thumb').style.left = pct + '%';
    document.getElementById('time-cur').textContent = fmt(audio.currentTime);
    document.getElementById('time-total').textContent = fmt(audio.duration);
  };
  audio.onended = () => { isPlaying = false; document.getElementById('play-btn').textContent = '▶'; };
  audio.onplay = () => { isPlaying = true; document.getElementById('play-btn').textContent = '⏸'; };
  audio.onpause = () => { isPlaying = false; document.getElementById('play-btn').textContent = '▶'; };
}

function switchVersion(version) {
  const wasPlaying = isPlaying;
  const currentTime = currentAudio.currentTime;
  currentAudio.pause();
  currentVersion = version;
  currentAudio = document.getElementById(version === 'music' ? 'audio-music' : 'audio-no-music');
  currentAudio.currentTime = currentTime;
  document.getElementById('btn-no-music').classList.toggle('active', version === 'no-music');
  document.getElementById('btn-music').classList.toggle('active', version === 'music');
  document.getElementById('version-label').textContent = version === 'music' ? 'With Music' : 'No Music Version';
  if (wasPlaying) currentAudio.play().catch(() => {});
}

function togglePlay() {
  if (isPlaying) currentAudio.pause();
  else currentAudio.play().catch(() => {});
}

function skipAudio(secs) {
  currentAudio.currentTime = Math.max(0, Math.min(currentAudio.duration || 0, currentAudio.currentTime + secs));
}

function seekAudio(e) {
  const bar = document.getElementById('timeline');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (currentAudio.duration) currentAudio.currentTime = pct * currentAudio.duration;
}

let dragging = false;
document.getElementById('timeline').addEventListener('mousedown', () => dragging = true);
document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const bar = document.getElementById('timeline');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (currentAudio.duration) currentAudio.currentTime = pct * currentAudio.duration;
});
document.addEventListener('mouseup', () => dragging = false);

document.getElementById('timeline').addEventListener('touchmove', (e) => {
  e.preventDefault();
  const bar = document.getElementById('timeline');
  const rect = bar.getBoundingClientRect();
  const touch = e.touches[0];
  const pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  if (currentAudio.duration) currentAudio.currentTime = pct * currentAudio.duration;
}, { passive: false });

function setVolume(val) {
  document.getElementById('audio-no-music').volume = val / 100;
  document.getElementById('audio-music').volume = val / 100;
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % speeds.length;
  const s = speeds[speedIdx];
  document.getElementById('speed-btn').textContent = s + '×';
  currentAudio.playbackRate = s;
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

init();
</script>
</body>
</html>
